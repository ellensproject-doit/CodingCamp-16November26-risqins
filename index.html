<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard — RevoU Mini Project</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="dashboard">

    <!-- ======= 1. GREETING CARD ======= -->
    <section class="card greeting-card">
      <time class="time" id="current-time">00:00:00</time>
      <div class="date" id="current-date"></div>
      <div class="greeting-text" id="greeting-text">Hello!</div>
    </section>

    <!-- ======= 2 & 3. MIDDLE ROW: TIMER + TASKS ======= -->
    <div class="middle-row">

      <!-- Focus Timer -->
      <section class="card timer-card">
        <h2>Focus Timer</h2>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <button class="btn btn-primary"   id="btn-start">Start</button>
          <button class="btn btn-secondary" id="btn-stop">Stop</button>
          <button class="btn btn-secondary" id="btn-reset">Reset</button>
        </div>
      </section>

      <!-- Tasks -->
      <section class="card tasks-card">
        <h2>Tasks</h2>
        <div class="task-input-row">
          <input
            type="text"
            id="task-input"
            placeholder="Add a new task…"
            autocomplete="off"
          />
          <button class="btn btn-primary" id="btn-add-task">Add</button>
        </div>
        <ul id="task-list"></ul>
      </section>

    </div>

    <!-- ======= 4. QUICK LINKS ======= -->
    <section class="card links-card">
      <h2>Quick Links</h2>
      <div class="link-input-row">
        <input
          type="text"
          id="link-name-input"
          placeholder="Link name"
          autocomplete="off"
        />
        <input
          type="text"
          id="link-url-input"
          placeholder="URL"
          autocomplete="off"
        />
        <button class="btn btn-primary" id="btn-add-link">Add Link</button>
      </div>
      <div id="links-container"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
